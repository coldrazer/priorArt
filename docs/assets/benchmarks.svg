<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470" role="img" aria-label="Prior Art Verified Engineering Benchmarks and Test Coverage">
  <defs>
    <linearGradient id="benchBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1015"/>
      <stop offset="100%" stop-color="#141923"/>
    </linearGradient>
    <linearGradient id="barGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2ea873"/>
      <stop offset="100%" stop-color="#7ff0b8"/>
    </linearGradient>
    <linearGradient id="barBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4d7fe6"/>
      <stop offset="100%" stop-color="#8ab4ff"/>
    </linearGradient>
  </defs>

  <rect width="1120" height="470" rx="16" fill="url(#benchBg)" stroke="#27303d" stroke-width="1.5"/>

  <!-- Header -->
  <text x="32" y="38" fill="#eef1f5" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="18" font-weight="700">Verified Engineering Telemetry &amp; Benchmarks (v0.2.0)</text>
  <text x="32" y="57" fill="#8b95a3" font-family="-apple-system, sans-serif" font-size="12">All values measured directly via scripts/explain_queries.py, scripts/backup.py drill, coverage.py, ruff, and mypy.</text>

  <!-- KPI Row -->
  <rect x="32" y="74" width="248" height="72" rx="10" fill="#161c26" stroke="#27303d"/>
  <text x="48" y="96" fill="#8b95a3" font-family="ui-monospace, monospace" font-size="10.5">AUTOMATED TESTS</text>
  <text x="48" y="128" fill="#7ff0b8" font-family="-apple-system, sans-serif" font-size="26" font-weight="800">224 / 224</text>
  <text x="176" y="128" fill="#9aa5b4" font-family="-apple-system, sans-serif" font-size="12">87% cov</text>

  <rect x="296" y="74" width="248" height="72" rx="10" fill="#161c26" stroke="#27303d"/>
  <text x="312" y="96" fill="#8b95a3" font-family="ui-monospace, monospace" font-size="10.5">STATIC QUALITY GATES</text>
  <text x="312" y="128" fill="#8ab4ff" font-family="-apple-system, sans-serif" font-size="26" font-weight="800">0 Errors</text>
  <text x="424" y="128" fill="#9aa5b4" font-family="-apple-system, sans-serif" font-size="12">ruff + mypy</text>

  <rect x="560" y="74" width="256" height="72" rx="10" fill="#161c26" stroke="#27303d"/>
  <text x="576" y="96" fill="#8b95a3" font-family="ui-monospace, monospace" font-size="10.5">SQLITE RESTORE DRILL (6.1 MB)</text>
  <text x="576" y="128" fill="#7ff0b8" font-family="-apple-system, sans-serif" font-size="26" font-weight="800">0.10 s</text>
  <text x="664" y="128" fill="#9aa5b4" font-family="-apple-system, sans-serif" font-size="12">SHA-256 match</text>

  <rect x="832" y="74" width="256" height="72" rx="10" fill="#161c26" stroke="#27303d"/>
  <text x="848" y="96" fill="#8b95a3" font-family="ui-monospace, monospace" font-size="10.5">FULL-TABLE SCANS / DRIFT</text>
  <text x="848" y="128" fill="#7ff0b8" font-family="-apple-system, sans-serif" font-size="26" font-weight="800">0 / 0</text>
  <text x="920" y="128" fill="#9aa5b4" font-family="-apple-system, sans-serif" font-size="12">62 DB objects</text>

  <!-- Left Panel: Hot Query Latency -->
  <rect x="32" y="164" width="512" height="284" rx="12" fill="#161c26" stroke="#27303d"/>
  <text x="52" y="192" fill="#eef1f5" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">SQLite Hot-Query Median Latency (µs)</text>
  <text x="52" y="210" fill="#8b95a3" font-family="-apple-system, sans-serif" font-size="11.5">100 owners · 400 reports · 12,000 overlaps · 200 runs/query · 0 table scans</text>

  <!-- Scale guide lines -->
  <line x1="210" y1="226" x2="210" y2="394" stroke="#253042" stroke-dasharray="3 3"/>
  <line x1="300" y1="226" x2="300" y2="394" stroke="#253042" stroke-dasharray="3 3"/>
  <line x1="390" y1="226" x2="390" y2="394" stroke="#253042" stroke-dasharray="3 3"/>
  <line x1="480" y1="226" x2="480" y2="394" stroke="#253042" stroke-dasharray="3 3"/>

  <!-- Bars (scale: 16 us -> 270px => 16.875 px per us) -->
  <text x="200" y="248" text-anchor="end" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="11.5">owner_by_token</text>
  <rect x="210" y="234" width="18" height="20" rx="4" fill="url(#barBlue)"/>
  <text x="236" y="248" fill="#8ab4ff" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700">1 µs</text>

  <text x="200" y="282" text-anchor="end" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="11.5">report_by_id</text>
  <rect x="210" y="268" width="34" height="20" rx="4" fill="url(#barBlue)"/>
  <text x="252" y="282" fill="#8ab4ff" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700">2 µs</text>

  <text x="200" y="316" text-anchor="end" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="11.5">recent_reports</text>
  <rect x="210" y="302" width="34" height="20" rx="4" fill="url(#barBlue)"/>
  <text x="252" y="316" fill="#8ab4ff" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700">2 µs</text>

  <text x="200" y="350" text-anchor="end" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="11.5">report_events_after</text>
  <rect x="210" y="336" width="135" height="20" rx="4" fill="url(#barBlue)"/>
  <text x="353" y="350" fill="#8ab4ff" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700">8 µs</text>

  <text x="200" y="384" text-anchor="end" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="11.5">report_overlaps</text>
  <rect x="210" y="370" width="270" height="20" rx="4" fill="url(#barBlue)"/>
  <text x="488" y="384" fill="#8ab4ff" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700">16 µs</text>

  <text x="210" y="410" text-anchor="middle" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">0 µs</text>
  <text x="300" y="410" text-anchor="middle" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">5 µs</text>
  <text x="390" y="410" text-anchor="middle" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">11 µs</text>
  <text x="480" y="410" text-anchor="middle" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">16 µs</text>

  <text x="52" y="434" fill="#9aa5b4" font-family="-apple-system, sans-serif" font-size="11">All 18 named queries + 13 FK lookups + 8 finish-trigger lookups verified index-backed.</text>

  <!-- Right Panel: Test Coverage by Core Module -->
  <rect x="560" y="164" width="528" height="284" rx="12" fill="#161c26" stroke="#27303d"/>
  <text x="580" y="192" fill="#eef1f5" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Line Coverage Across Core Modules (%)</text>
  <text x="580" y="210" fill="#8b95a3" font-family="-apple-system, sans-serif" font-size="11.5">4,233 statements · 87% overall · dashed line = 85% CI enforcement gate</text>

  <!-- 85% CI Gate line (x=700 + 0.85*320 = 972) -->
  <line x1="972" y1="224" x2="972" y2="426" stroke="#f5b855" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="972" y="438" text-anchor="middle" fill="#f5b855" font-family="ui-monospace, monospace" font-size="9.5">85% CI gate</text>

  <!-- 10 module bars (width max = 320px at 100%) -->
  <g font-family="ui-monospace, monospace" font-size="11">
    <text x="692" y="239" text-anchor="end" fill="#cbd5e1">report.py</text>
    <rect x="700" y="227" width="320" height="14" rx="3" fill="url(#barGreen)"/>
    <text x="1028" y="239" fill="#7ff0b8" font-weight="700">100%</text>

    <text x="692" y="261" text-anchor="end" fill="#cbd5e1">queries.py</text>
    <rect x="700" y="249" width="320" height="14" rx="3" fill="url(#barGreen)"/>
    <text x="1028" y="261" fill="#7ff0b8" font-weight="700">100%</text>

    <text x="692" y="283" text-anchor="end" fill="#cbd5e1">log.py</text>
    <rect x="700" y="271" width="317" height="14" rx="3" fill="url(#barGreen)"/>
    <text x="1028" y="283" fill="#7ff0b8" font-weight="700">99%</text>

    <text x="692" y="305" text-anchor="end" fill="#cbd5e1">migrate.py</text>
    <rect x="700" y="293" width="307" height="14" rx="3" fill="url(#barGreen)"/>
    <text x="1028" y="305" fill="#7ff0b8" font-weight="700">96%</text>

    <text x="692" y="327" text-anchor="end" fill="#cbd5e1">pipeline.py</text>
    <rect x="700" y="315" width="288" height="14" rx="3" fill="url(#barGreen)"/>
    <text x="1028" y="327" fill="#7ff0b8" font-weight="700">90%</text>

    <text x="692" y="349" text-anchor="end" fill="#cbd5e1">llm.py</text>
    <rect x="700" y="337" width="285" height="14" rx="3" fill="url(#barGreen)"/>
    <text x="1028" y="349" fill="#7ff0b8" font-weight="700">89%</text>

    <text x="692" y="371" text-anchor="end" fill="#cbd5e1">store.py</text>
    <rect x="700" y="359" width="282" height="14" rx="3" fill="url(#barGreen)"/>
    <text x="1028" y="371" fill="#7ff0b8" font-weight="700">88%</text>

    <text x="692" y="393" text-anchor="end" fill="#cbd5e1">lifecycle.py</text>
    <rect x="700" y="381" width="278" height="14" rx="3" fill="url(#barGreen)"/>
    <text x="1028" y="393" fill="#7ff0b8" font-weight="700">87%</text>

    <text x="692" y="415" text-anchor="end" fill="#cbd5e1">server.py</text>
    <rect x="700" y="403" width="272" height="14" rx="3" fill="url(#barGreen)"/>
    <text x="1028" y="415" fill="#7ff0b8" font-weight="700">85%</text>
  </g>
</svg>
