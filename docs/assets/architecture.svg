<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" width="1120" height="430" role="img" aria-label="Prior Art 7-Stage Evidence Verification Architecture">
  <defs>
    <linearGradient id="archBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1015"/>
      <stop offset="100%" stop-color="#141923"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3dd68c"/>
    </marker>
  </defs>

  <rect width="1120" height="430" rx="16" fill="url(#archBg)" stroke="#27303d" stroke-width="1.5"/>
  <text x="32" y="38" fill="#eef1f5" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="17" font-weight="700">Prior Art — Seven-Stage Evidence &amp; Verification Pipeline</text>
  <text x="32" y="57" fill="#8b95a3" font-family="-apple-system, sans-serif" font-size="12">Untrusted web content is fenced inside JSON payloads only; every overlap must clear both deterministic code and an independent model family.</text>

  <!-- Row 1: Discovery & Retrieval -->
  <!-- Stage 1 -->
  <rect x="32" y="82" width="228" height="94" rx="12" fill="#161c26" stroke="#8ab4ff" stroke-opacity="0.5"/>
  <text x="48" y="105" fill="#8ab4ff" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">STAGE 1 · DECOMPOSE</text>
  <text x="48" y="126" fill="#eef1f5" font-family="-apple-system, sans-serif" font-size="14" font-weight="650">Features &amp; Query Plan</text>
  <text x="48" y="146" fill="#9aa5b4" font-family="-apple-system, sans-serif" font-size="11.5">4–7 checkable features (F1–F7)</text>
  <text x="48" y="162" fill="#9aa5b4" font-family="-apple-system, sans-serif" font-size="11.5">≤ 14 queries · Writer LLM (Nebius)</text>

  <line x1="260" y1="129" x2="298" y2="129" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Stage 2 -->
  <rect x="304" y="82" width="240" height="94" rx="12" fill="#161c26" stroke="#f5b855" stroke-opacity="0.5"/>
  <text x="320" y="105" fill="#f5b855" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">STAGE 2 · MULTI-SOURCE SEARCH</text>
  <text x="320" y="126" fill="#eef1f5" font-family="-apple-system, sans-serif" font-size="14" font-weight="650">Tavily Advanced (6 Sources)</text>
  <text x="320" y="146" fill="#9aa5b4" font-family="-apple-system, sans-serif" font-size="11.5">GitHub · HN · Prod Hunt · arXiv</text>
  <text x="320" y="162" fill="#9aa5b4" font-family="-apple-system, sans-serif" font-size="11.5">Devpost · Web · 14-wide parallel</text>

  <line x1="544" y1="129" x2="582" y2="129" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Stage 3 -->
  <rect x="588" y="82" width="224" height="94" rx="12" fill="#161c26" stroke="#8ab4ff" stroke-opacity="0.5"/>
  <text x="604" y="105" fill="#8ab4ff" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">STAGE 3 · SHORTLIST</text>
  <text x="604" y="126" fill="#eef1f5" font-family="-apple-system, sans-serif" font-size="14" font-weight="650">Dedupe &amp; Triage</text>
  <text x="604" y="146" fill="#9aa5b4" font-family="-apple-system, sans-serif" font-size="11.5">Query-safe URL normalization</text>
  <text x="604" y="162" fill="#9aa5b4" font-family="-apple-system, sans-serif" font-size="11.5">Drops listicles/news · ≤ 8 picks</text>

  <line x1="812" y1="129" x2="850" y2="129" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Stage 4 -->
  <rect x="856" y="82" width="232" height="94" rx="12" fill="#161c26" stroke="#f5b855" stroke-opacity="0.5"/>
  <text x="872" y="105" fill="#f5b855" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">STAGE 4 · EXTRACT</text>
  <text x="872" y="126" fill="#eef1f5" font-family="-apple-system, sans-serif" font-size="14" font-weight="650">Full Page Text + Flags</text>
  <text x="872" y="146" fill="#9aa5b4" font-family="-apple-system, sans-serif" font-size="11.5">Per-URL SQLite cache (24h TTL)</text>
  <text x="872" y="162" fill="#9aa5b4" font-family="-apple-system, sans-serif" font-size="11.5">Snippet fallback · Injection scan</text>

  <!-- Connector down from Stage 4 to Row 2 -->
  <path d="M 972 176 L 972 196 L 146 196 L 146 212" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Row 2: Parallel Compare & Double-Check -->
  <!-- Stage 5 -->
  <rect x="32" y="218" width="228" height="98" rx="12" fill="#161c26" stroke="#8ab4ff" stroke-opacity="0.5"/>
  <text x="48" y="241" fill="#8ab4ff" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">STAGE 5 · COMPARE (8-WIDE)</text>
  <text x="48" y="262" fill="#eef1f5" font-family="-apple-system, sans-serif" font-size="14" font-weight="650">Quote-Backed Claims</text>
  <text x="48" y="282" fill="#9aa5b4" font-family="-apple-system, sans-serif" font-size="11.5">Random &lt;&lt;&lt;PAGE&gt;&gt;&gt; data fence</text>
  <text x="48" y="298" fill="#9aa5b4" font-family="-apple-system, sans-serif" font-size="11.5">Every score &gt; 0 requires quote</text>

  <line x1="260" y1="267" x2="298" y2="267" stroke="#3dd68c" stroke-width="1.8" marker-end="url(#arrGreen)"/>

  <!-- Stage 6A -->
  <rect x="304" y="218" width="240" height="98" rx="12" fill="#132620" stroke="#3dd68c" stroke-opacity="0.65"/>
  <text x="320" y="241" fill="#7ff0b8" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">CHECK A · DETERMINISTIC CODE</text>
  <text x="320" y="262" fill="#eef1f5" font-family="-apple-system, sans-serif" font-size="14" font-weight="650">Is the Quote on the Page?</text>
  <text x="320" y="282" fill="#b9e6d0" font-family="-apple-system, sans-serif" font-size="11.5">Unicode + CJK + negation guard</text>
  <text x="320" y="298" fill="#b9e6d0" font-family="-apple-system, sans-serif" font-size="11.5">Hallucinated quotes → cut_quote</text>

  <line x1="544" y1="267" x2="582" y2="267" stroke="#3dd68c" stroke-width="1.8" marker-end="url(#arrGreen)"/>

  <!-- Stage 6B -->
  <rect x="588" y="218" width="224" height="98" rx="12" fill="#132620" stroke="#3dd68c" stroke-opacity="0.65"/>
  <text x="604" y="241" fill="#7ff0b8" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">CHECK B · CROSS-FAMILY LLM</text>
  <text x="604" y="262" fill="#eef1f5" font-family="-apple-system, sans-serif" font-size="14" font-weight="650">Independent Verifier</text>
  <text x="604" y="282" fill="#b9e6d0" font-family="-apple-system, sans-serif" font-size="11.5">Different model family (Qwen)</text>
  <text x="604" y="298" fill="#b9e6d0" font-family="-apple-system, sans-serif" font-size="11.5">Confirm · Lower · Cut · Unchecked</text>

  <line x1="812" y1="267" x2="850" y2="267" stroke="#3dd68c" stroke-width="1.8" marker-end="url(#arrGreen)"/>

  <!-- Stage 7 -->
  <rect x="856" y="218" width="232" height="98" rx="12" fill="#161c26" stroke="#3dd68c" stroke-opacity="0.5"/>
  <text x="872" y="241" fill="#7ff0b8" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">STAGE 7 · SYNTHESIZE</text>
  <text x="872" y="262" fill="#eef1f5" font-family="-apple-system, sans-serif" font-size="14" font-weight="650">Novelty, Gaps &amp; Pivots</text>
  <text x="872" y="282" fill="#9aa5b4" font-family="-apple-system, sans-serif" font-size="11.5">Score computed strictly in code</text>
  <text x="872" y="298" fill="#9aa5b4" font-family="-apple-system, sans-serif" font-size="11.5">3 gap-targeted pivots, cited [n]</text>

  <!-- Foundation Bar -->
  <rect x="32" y="338" width="1056" height="72" rx="12" fill="#12161e" stroke="#27303d"/>
  <text x="52" y="362" fill="#eef1f5" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Production Runtime &amp; Guardrails</text>
  <text x="52" y="382" fill="#9aa5b4" font-family="ui-monospace, monospace" font-size="11">SQLite STRICT/WAL (0005) · Async SSE Replay + 15s Heartbeat · Owner Cookies · Token-Bucket Rate Limits</text>
  <text x="52" y="399" fill="#9aa5b4" font-family="ui-monospace, monospace" font-size="11">Daily Spend Guardrail · SHA-256 CSP + Zero Inline Styles · Circuit Breakers · Structured JSON Logs</text>
</svg>
