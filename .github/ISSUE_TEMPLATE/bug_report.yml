name: Bug Report
description: Report a defect, wrong citation behavior, or unexpected failure
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `PRIORART_FAKE=1 python src/agent.py serve`
        2. Submit idea ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "macOS / Ubuntu, Python 3.12, SQLite 3.53"
